server:
    interface: 10.10.2.53
    interface: 127.0.0.1
    port: 53
    interface: 10.10.2.53@853
    tls-port: 853
    tls-service-key: "@PROJECT@/unbound/certs/server.key"
    tls-service-pem: "@PROJECT@/unbound/certs/server.crt"
    access-control: 10.10.1.0/24 allow
    access-control: 10.10.2.0/24 allow
    access-control: 127.0.0.0/8 allow
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    username: ""
    chroot: ""
    directory: "@PROJECT@/unbound"
    pidfile: "@PROJECT@/runtime/unbound.pid"
    root-hints: "@PROJECT@/unbound/root.hints"
    module-config: "iterator"
    qname-minimisation: no
    cache-min-ttl: 0
    cache-max-ttl: 86400
    prefetch: no
    use-syslog: no
    verbosity: 1
    local-zone: "lab." nodefault
remote-control:
    control-enable: yes
    control-interface: "@PROJECT@/runtime/unbound.sock"
    control-use-cert: no
